name: Manter backend ativo

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: backend-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verificar saúde da API
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
        run: |
          if [[ -z "$BACKEND_BASE_URL" ]]; then
            echo "::error::Configure a variável BACKEND_BASE_URL com a URL HTTPS do backend no Render."
            exit 1
          fi

          probe() {
            curl --silent --show-error \
              --proto '=https' \
              --connect-timeout 15 \
              --max-time 90 \
              --retry 1 \
              --retry-delay 5 \
              --output health.json \
              --write-out '%{http_code}' \
              "${BACKEND_BASE_URL%/}$1"
          }

          endpoint=/health
          http_status=$(probe "$endpoint")
          if [[ "$http_status" == "404" ]]; then
            echo "::warning::/health não encontrado. Verificando a rota raiz da API para compatibilidade com deploys antigos."
            endpoint=/
            http_status=$(probe "$endpoint")
          fi

          if [[ "$http_status" != "200" ]]; then
            echo "::error::A API respondeu HTTP $http_status em $endpoint. Confira BACKEND_BASE_URL (somente a origem HTTPS, sem /health ou /api/v1) e o deploy no Render."
            exit 1
          fi

          python3 - "$endpoint" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path("health.json").read_text())
          if sys.argv[1] == "/health":
              valid = payload == {"status": "ok"}
          else:
              valid = isinstance(payload, dict) and payload.get("status") == "A API do ContaFlow está no ar! 🚀"
          if not valid:
              raise SystemExit("Resposta inesperada da API. Confira se BACKEND_BASE_URL aponta para o backend ContaFlow.")
          print("Backend ativo e respondendo.")
          PY
