name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — testes e migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/contablytask_migrations
      ENVIRONMENT: test
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_KEY: ci-placeholder
      SUPABASE_STORAGE_BUCKET: documentos-contablytask-test
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      ASAAS_ENV: sandbox
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contablytask_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contablytask_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependências
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verificar sintaxe Python
        working-directory: backend
        run: python -m compileall -q .

      - name: Executar testes e validar migrations em PostgreSQL vazio
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    name: Frontend — lint, tipos e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_APP_ENV: test
      VITE_API_URL: http://localhost:8000
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Instalar dependências
        working-directory: front-end
        run: npm ci

      - name: Verificar lint
        working-directory: front-end
        run: npm run lint:check

      - name: Verificar formatação
        working-directory: front-end
        run: npm run format:check

      - name: Verificar tipos
        working-directory: front-end
        run: npm run type-check

      - name: Gerar build de produção
        working-directory: front-end
        run: npm run build-only

  backend-dependencies:
    name: Segurança — dependências Python
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar auditor
        run: python -m pip install pip-audit==2.10.1

      - name: Auditar dependências de produção
        working-directory: backend
        run: python -m pip_audit -r requirements.txt --progress-spinner off

  frontend-dependencies:
    name: Segurança — dependências JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Auditar dependências
        working-directory: front-end
        run: npm audit --audit-level=high
