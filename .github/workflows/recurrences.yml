name: Reconciliar tarefas recorrentes

on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-recurrences
  cancel-in-progress: false

jobs:
  process-recurrences:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acionar reconciliador protegido
        env:
          RECURRENCE_PROCESS_URL: ${{ secrets.RECURRENCE_PROCESS_URL || vars.BACKEND_BASE_URL }}
          RECURRENCE_CRON_SECRET: ${{ secrets.RECURRENCE_CRON_SECRET }}
        run: |
          missing=0
          if [[ -z "$RECURRENCE_PROCESS_URL" ]]; then
            echo "::error::Configure a variável de repositório BACKEND_BASE_URL ou o secret RECURRENCE_PROCESS_URL com a origem HTTPS do backend, sem caminho."
            missing=1
          fi
          if [[ -z "$RECURRENCE_CRON_SECRET" ]]; then
            echo "::error::Configure o secret de repositório RECURRENCE_CRON_SECRET no GitHub Actions e a variável de mesmo nome no Render, com valores iguais."
            missing=1
          fi
          if [[ "$missing" == "1" ]]; then
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 120 \
            --request POST \
            --header "X-Cron-Secret: $RECURRENCE_CRON_SECRET" \
            "${RECURRENCE_PROCESS_URL%/}/api/v1/obrigacoes/recorrencias/processar"
