name: Processar alertas de vencimento

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deadline-alerts
  cancel-in-progress: false

jobs:
  process-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acionar processador protegido
        env:
          ALERT_PROCESS_URL: ${{ secrets.ALERT_PROCESS_URL || vars.BACKEND_BASE_URL }}
          ALERT_CRON_SECRET: ${{ secrets.ALERT_CRON_SECRET }}
        run: |
          missing=0
          if [[ -z "$ALERT_PROCESS_URL" ]]; then
            echo "::error::Configure a variável de repositório BACKEND_BASE_URL ou o secret ALERT_PROCESS_URL com a origem HTTPS do backend, sem caminho."
            missing=1
          fi
          if [[ -z "$ALERT_CRON_SECRET" ]]; then
            echo "::error::Configure o secret de repositório ALERT_CRON_SECRET no GitHub Actions e a variável de mesmo nome no Render, com valores iguais."
            missing=1
          fi
          if [[ "$missing" == "1" ]]; then
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 120 \
            --request POST \
            --header "X-Cron-Secret: $ALERT_CRON_SECRET" \
            "${ALERT_PROCESS_URL%/}/api/v1/alertas/processar"
